<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Prédiction Aviator ×5 / ×10 | Top Anthonio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background: linear-gradient(135deg, #0f172a, #1e1b4b, #000);
    color:white;
    padding-top:30px;
}

.container{
    width:500px;
    padding:30px;
    border-radius:25px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    box-shadow: 0 0 50px rgba(0,0,0,0.7);
    text-align:center;
    animation: glow 2s infinite alternate;
}

@keyframes glow{
    0%{box-shadow:0 0 40px rgba(255,77,166,0.4);}
    50%{box-shadow:0 0 70px rgba(255,77,166,0.7);}
    100%{box-shadow:0 0 40px rgba(255,77,166,0.4);}
}

h1{
    margin-bottom:20px;
    font-size:22px;
    letter-spacing:1px;
    text-shadow:0 0 15px #ff4da6;
}

input{
    width:40%;
    padding:12px;
    margin:5px 5px;
    border:none;
    border-radius:12px;
    background: rgba(255,255,255,0.08);
    color:white;
    font-size:15px;
    outline:none;
}

input::placeholder{color: rgba(255,255,255,0.6);}

button{
    width:95%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:15px;
    background: linear-gradient(90deg,#ff4da6,#a855f7);
    color:white;
    font-weight:700;
    cursor:pointer;
    font-size:16px;
    box-shadow:0 0 20px rgba(255,77,166,0.6);
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 35px rgba(255,77,166,1);
}

.prediction-box{
    margin-top:20px;
    padding:20px;
    border-radius:20px;
    background: rgba(255,77,166,0.2);
    border: 2px solid #a855f7;
    text-align:center;
    font-size:18px;
    color:#fff;
    text-shadow:0 0 8px #ff4da6,0 0 15px #a855f7;
    position: relative;
}

.prediction-time{
    margin-top:10px;
    font-size:16px;
    color:#38bdf8;
    text-shadow:0 0 5px #38bdf8,0 0 10px #38bdf8;
}

.prediction-tags{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:10px;
}

.tag{
    padding:5px 12px;
    border-radius:12px;
    font-weight:700;
    font-size:14px;
}

.x5{background:#22c55e; color:white;}
.x10{background:#f59e0b; color:white;}

.history{
    margin-top:20px;
    text-align:left;
    max-height:250px;
    overflow-y:auto;
    font-size:14px;
}

.advice{
    margin-top:15px;
    font-size:14px;
    color:#a855f7;
    text-shadow:0 0 8px #a855f7;
}

.author{
    margin-top:20px;
    font-size:16px;
    font-weight:700;
    color:#ff4da6;
    text-shadow:0 0 8px #ff4da6,0 0 12px #a855f7;
}

.result-buttons{
    margin-top:10px;
    display:flex;
    justify-content:center;
    gap:20px;
}

.result-buttons button{
    width:100px;
    padding:8px;
    font-size:14px;
}
</style>
</head>
<body>

<div class="container">
<h1>🧡 Prédiction Aviator ×5 / ×10</h1>

<p>Rose 1 :</p>
<input type="number" id="rose1h" placeholder="HH" min="0" max="23">
<input type="number" id="rose1m" placeholder="MN" min="0" max="59">

<p>Rose 2 :</p>
<input type="number" id="rose2h" placeholder="HH" min="0" max="23">
<input type="number" id="rose2m" placeholder="MN" min="0" max="59">

<button onclick="calculerPrediction()">Calculer Prédiction</button>

<div id="predictions-container"></div>

<div class="history" id="history">
<strong>Historique (3 dernières prédictions) :</strong><br>
</div>

<div class="advice">
💡 Conseil : choisir 2 roses un peu éloignées pour un intervalle plus fiable.
</div>

<div class="author">Top Anthonio Rabarinirina 🔥❤️</div>

<div style="margin-top:15px;">
<strong>Total Gagné :</strong> <span id="total-win">0</span> |
<strong>Total Perdu :</strong> <span id="total-lose">0</span>
</div>

</div>

<script>
let historique = [];
let totalWin = 0;
let totalLose = 0;

function calculerPrediction(){
    let h1=parseInt(document.getElementById("rose1h").value);
    let m1=parseInt(document.getElementById("rose1m").value);
    let h2=parseInt(document.getElementById("rose2h").value);
    let m2=parseInt(document.getElementById("rose2m").value);

    if(isNaN(h1) || isNaN(m1) || isNaN(h2) || isNaN(m2)){
        alert("Veuillez remplir toutes les cases correctement!");
        return;
    }

    // Calcul de l'intervalle (caché)
    let intervalle = (m2 - m1) + 1;
    if(intervalle <= 0) intervalle += 60;

    // Rose prédite
    let nextM = m2 + intervalle;
    let nextH = h2;
    if(nextM >= 60){
        nextH += Math.floor(nextM/60);
        nextM = nextM % 60;
    }
    nextH = nextH % 24;
    let prediction = `${nextH.toString().padStart(2,"0")}:${nextM.toString().padStart(2,"0")}`;

    // Créer un cadre de prédiction
    let predDiv = document.createElement("div");
    predDiv.classList.add("prediction-box");
    predDiv.innerHTML = `<div class="prediction-time">${prediction}</div>
                         <div class="prediction-tags">
                         <span class="tag x5">×5 Assuré 100%</span>
                         <span class="tag x10">×10 Risqué</span>
                         </div>
                         <div class="result-buttons">
                         <button onclick="marquerGagner(this)">Gagner</button>
                         <button onclick="marquerPerdu(this)">Perdre</button>
                         </div>`;

    // Ajouter au début pour garder les 3 dernières
    let container = document.getElementById("predictions-container");
    container.prepend(predDiv);
    if(container.children.length > 3){
        container.removeChild(container.lastChild);
    }

    // Ajouter dans l'historique
    historique.unshift(`Rose1: ${h1.toString().padStart(2,"0")}:${m1.toString().padStart(2,"0")} | Rose2: ${h2.toString().padStart(2,"0")}:${m2.toString().padStart(2,"0")} → Rose prédite: ${prediction}`);
    if(historique.length > 3) historique.pop();
    document.getElementById("history").innerHTML="<strong>Historique (3 dernières prédictions) :</strong><br>"+historique.join("<br>");
}

function marquerGagner(btn){
    totalWin++;
    document.getElementById("total-win").innerText = totalWin;
    btn.disabled = true;
    btn.nextElementSibling.disabled = true;
}

function marquerPerdu(btn){
    totalLose++;
    document.getElementById("total-lose").innerText = totalLose;
    btn.disabled = true;
    btn.previousElementSibling.disabled = true;
}
</script>

</body>
    </html>
