<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation VIP - V20 ULTRA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }

        /* --- SÉCURITÉ --- */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px;
        }
        .plane-anim {
            width: 70px; fill: #ff0000; filter: drop-shadow(0 0 10px red);
            animation: fly 3s infinite ease-in-out; margin-bottom: 20px;
        }
        @keyframes fly { 0%, 100% { transform: translateY(0) rotate(2deg); } 50% { transform: translateY(-15px) rotate(-5deg); } }
        input {
            width: 100%; max-width: 300px; padding: 15px; background: #111;
            border: 1px solid #ff0000; color: #00ff00; border-radius: 10px;
            text-align: center; font-size: 1.2rem; margin-bottom: 15px; outline: none;
        }
        .btn-red {
            width: 100%; max-width: 300px; padding: 15px; background: #ff0000;
            color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;
        }

        /* --- INTERFACE --- */
        .container { padding: 10px; max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; min-height: 100vh; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; background: #111; padding: 5px; border-radius: 10px; }
        .tab { flex: 1; padding: 12px 5px; text-align: center; border-radius: 8px; font-size: 10px; cursor: pointer; color: #666; transition: 0.3s; }
        .tab.active { background: #ff0000; color: #fff; font-weight: bold; }

        .panel { display: none; background: #0a0a0a; padding: 15px; border-radius: 15px; border: 1px solid #222; flex-grow: 1; }
        .panel.active { display: block; }

        /* DOTS */
        .dot-container { display: flex; gap: 8px; justify-content: center; margin: 20px 0; }
        .dot { width: 45px; height: 45px; background: #000; border: 2px solid #ff0000; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        /* RESULTATS */
        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .res-box { padding: 15px; border-radius: 12px; text-align: center; border-left: 5px solid; background: #050505; }
        .rose { border-color: #ff0055; } 
        .blue { border-color: #0088ff; }
        .gold { border-color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        .time { display: block; font-size: 1.2rem; color: #00ff00; font-weight: bold; margin-top: 5px; }
        
        .logout-btn { display: block; width: 90%; margin: 20px auto; padding: 12px; background: transparent; color: #444; border: 1px solid #222; border-radius: 10px; font-size: 11px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <svg class="plane-anim" viewBox="0 0 24 24"><path d="M21,16L21,14L13,9L13,3.5A1.5,1.5 0 0,0 11.5,2A1.5,1.5 0 0,0 10,3.5L10,9L2,14L2,16L10,13.5L10,19L8,20.5L8,22L11.5,21L15,22L15,20.5L13,19L13,13.5L21,16Z"/></svg>
        <h3 style="letter-spacing:3px; margin-bottom:20px; font-size:14px; color:#ff0000;">ACCÈS VIP</h3>
        <input type="text" id="code-in" placeholder="CODE MEMBRE">
        <button class="btn-red" onclick="login()">VALIDER</button>
        <p id="err" style="color:red; font-size:11px; margin-top:15px; display:none;"></p>
    </div>

    <div class="container">
        <div class="tabs">
            <div class="tab active" onclick="tab('col', this)">COULEURS</div>
            <div class="tab" onclick="tab('ct', this)">COTES</div>
            <div id="tab-admin-gen" class="tab" onclick="tab('ad', this)" style="display:none; color:#f00;">GÉNÉRER</div>
            <div id="tab-admin-mem" class="tab" onclick="tab('mem', this)" style="display:none; color:#f00;">MEMBRES</div>
        </div>

        <div id="p-col" class="panel active">
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <button class="btn-red" style="background:#003366; flex:1;" onclick="add('💙')">💙</button>
                <button class="btn-red" style="background:#330044; flex:1;" onclick="add('💜')">💜</button>
                <button class="btn-red" style="background:#440011; flex:1;" onclick="add('🌹')">🌹</button>
            </div>
            <div class="dot-container">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <input type="time" id="t-col" step="1" onchange="calcCol()">
            <div id="r-col" class="res-grid"></div>
        </div>

        <div id="p-ct" class="panel">
            <input type="number" id="v-ct" placeholder="EX: 2.50" step="0.01">
            <input type="time" id="t-ct" step="1" onchange="calcCt()">
            <div id="r-ct" class="res-grid"></div>
        </div>

        <div id="p-ad" class="panel"><div style="text-align:center; padding:20px 0;"><div id="new-code-display" style="font-size:3rem; color:#ff0000; margin:20px 0; font-weight:bold;">----</div><button class="btn-red" onclick="generateCode()">GÉNÉRER CODE</button></div></div>
        <div id="p-mem" class="panel"><div id="member-list"></div></div>

        <button class="logout-btn" onclick="logout()">DÉCONNECTER</button>
    </div>

<script>
    const getDeviceId = () => navigator.userAgent + screen.width + screen.height;
    let db = JSON.parse(localStorage.getItem("aviator_db")) || {};

    // --- BASE DE DONNÉES COMPLÈTE (EXTRAITE DES IMAGES) ---
    const patterns = {
        "💙💜🌹💙💙": [{m:3, c:"x60 / x10", s:"blue"}, {m:7, c:"x25", s:"rose"}],
        "💙💜🌹💙💜": [{m:8, c:"x15", s:"blue"}, {m:13, c:"x70", s:"rose"}, {m:16, c:"x30/x10", s:"blue"}],
        "💜💙🌹💙💜": [{m:3, c:"x25", s:"rose"}, {m:11, c:"x10/x30", s:"blue"}, {m:23, c:"x20", s:"blue"}, {m:41, c:"x20/x40", s:"rose"}],
        "💜💙🌹💙💙": [{m:3, c:"x40 / x20 / x70", s:"rose"}, {m:8, c:"x50 / x200", s:"rose"}, {m:16, c:"x40 / x15", s:"blue"}],
        "💜💜🌹💙💜": [{m:7, c:"x20 (1m avant)", s:"blue"}, {m:9, c:"x60 / x300", s:"rose"}, {m:21, c:"x10", s:"blue"}],
        "💜💙🌹💜💜": [{m:3, c:"x10", s:"blue"}, {m:10, c:"x20/x20", s:"blue"}],
        "💙💙🌹💜💜": [{m:9, c:"x10 & x10", s:"blue"}, {m:13, c:"x15 / x30", s:"blue"}],
        "💜💜🌹💜💙": [{m:5, c:"x50 / x15", s:"rose"}, {m:12, c:"x40", s:"blue"}, {m:21, c:"x10 AUTO", s:"rose"}, {m:33, c:"x10", s:"blue"}, {m:52, c:"x300", s:"rose"}],
        "💙💙🌹💙💙": [{m:3, c:"x30 / x400", s:"gold"}, {m:8, c:"x20 | x100", s:"rose"}, {m:17, c:"x50 AUTO", s:"rose"}, {m:28, c:"x25 / x10", s:"blue"}],
        "💜💙🌹💜💙": [{m:7, c:"x50 & x20", s:"rose"}, {m:11, c:"x10", s:"blue"}, {m:13, c:"x100 / x10", s:"rose"}],
        "💙💙🌹💙💜": [{m:3, c:"x80 / x10 / x25", s:"rose"}, {m:10, c:"x10 / x70", s:"blue"}, {m:25, c:"x3000", s:"gold"}],
        "💙💜🌹💜💜": [{m:7, c:"x10 / x40", s:"blue"}, {m:10, c:"x30 / x10", s:"blue"}],
        "💜💜🌹💙💙": [{m:5, c:"x300 / x20", s:"gold"}, {m:7, c:"x30 / x80", s:"rose"}, {m:14, c:"x10", s:"blue"}, {m:26, c:"x15", s:"blue"}],
        "💙💜🌹💜💙": [{m:3, c:"x50", s:"blue"}, {m:10, c:"x150 / x25", s:"rose"}, {m:20, c:"x15", s:"blue"}]
    };

    function login() {
        const input = document.getElementById("code-in").value.trim();
        const device = getDeviceId();
        if (input === "091110") {
            document.querySelectorAll('[id^="tab-admin"]').forEach(el => el.style.display = "block");
            document.getElementById("auth-screen").style.display = "none";
            localStorage.setItem("admin_active", "true");
            updateMemberList();
            return;
        }
        if (db.hasOwnProperty(input)) {
            if (db[input] === null || db[input] === device) {
                db[input] = device;
                localStorage.setItem("aviator_db", JSON.stringify(db));
                localStorage.setItem("my_active_session", input);
                document.getElementById("auth-screen").style.display = "none";
            } else { alert("CODE DÉJÀ UTILISÉ SUR UN AUTRE APPAREIL"); }
        } else { alert("CODE INVALIDE"); }
    }

    function logout() { localStorage.clear(); location.reload(); }

    window.onload = () => {
        const session = localStorage.getItem("my_active_session");
        const isAdmin = localStorage.getItem("admin_active");
        if (isAdmin === "true" || (session && db[session] === getDeviceId())) {
            if(isAdmin === "true") document.querySelectorAll('[id^="tab-admin"]').forEach(el => el.style.display = "block");
            document.getElementById("auth-screen").style.display = "none";
        }
    };

    let seq = [];
    function add(e) {
        if(seq.length >= 5) seq = [];
        seq.push(e);
        document.querySelectorAll('.dot').forEach((d, i) => d.innerText = seq[i] || '');
        if(seq.length === 5) calcCol();
    }

    function calcCol() {
        const t = document.getElementById("t-col").value;
        const res = document.getElementById("r-col");
        if(!t || seq.length < 5) return;
        const found = patterns[seq.join('')];
        if(!found) { res.innerHTML = "<p style='grid-column:span 2; color:#333; text-align:center;'>AUCUN SIGNAL</p>"; return; }
        draw(t, found, res);
    }

    function calcCt() {
        const v = parseFloat(document.getElementById("v-ct").value);
        const t = document.getElementById("t-ct").value;
        const res = document.getElementById("r-ct");
        if(!v || !t) return;
        let l = [];
        if(v >= 2.5 && v <= 3.5) l.push({m:2.166, c:"SIGNAL X3", s:"blue"});
        else if(v >= 4.5 && v <= 6.5) l.push({m:4.166, c:"SIGNAL X5", s:"blue"});
        else if(v >= 6.5) l.push({m:6.166, c:"SIGNAL X10", s:"rose"});
        draw(t, l, res);
    }

    function draw(t, list, div) {
        const [h, m, s] = t.split(':').map(Number);
        div.innerHTML = list.map(i => {
            let d = new Date();
            d.setHours(h, m, (s || 0) + (i.m * 60));
            let colorClass = i.s;
            if(i.c.includes("3000") || i.c.includes("400")) colorClass = "gold";
            return `<div class="res-box ${colorClass}"><small style="font-size:9px; color:white;">${i.c}</small><span class="time">${d.toLocaleTimeString('fr-FR')}</span></div>`;
        }).join('');
    }

    function generateCode() {
        const code = Math.floor(1000 + Math.random() * 9000).toString();
        db[code] = null;
        localStorage.setItem("aviator_db", JSON.stringify(db));
        document.getElementById("new-code-display").innerText = code;
        updateMemberList();
    }

    function updateMemberList() {
        const listDiv = document.getElementById("member-list");
        listDiv.innerHTML = "";
        for (let code in db) {
            listDiv.innerHTML += `<div class="member-item"><div><b>${code}</b></div><button class="btn-expulser" onclick="expulser('${code}')">SUPPRIMER</button></div>`;
        }
    }

    function expulser(code) { if(confirm("Supprimer ?")) { delete db[code]; localStorage.setItem("aviator_db", JSON.stringify(db)); updateMemberList(); } }
    function tab(id, el) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('p-'+id).classList.add('active');
        el.classList.add('active');
    }
</script>
</body>
</html>
